# DataPilot — Render Blueprint (one-click deploy: Web Service + Postgres)
# Dashboard -> New + -> Blueprint -> point at this repo.
# Verified against Render's blueprint spec + render-examples/remix-postgres:
# services use `env: node` (not `runtime:`), DB wiring uses
# fromDatabase { name, property: connectionString }.

services:
  - type: web
    name: datapilot
    env: node
    branch: main
    plan: free # bump to starter for no-sleep + more RAM
    # NOTE: preDeployCommand needs a paid instance type, so it is omitted
    # here. The idempotent DB init runs in the start command instead (same
    # pattern as Render's own remix-postgres example, which runs
    # `prisma migrate deploy` in startCommand). Runtime is also where the
    # internal DATABASE_URL hostname is guaranteed to resolve.
    buildCommand: npm ci && npm run build
    startCommand: npm run db:init && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-db
          property: connectionString # internal URL, same region
      - key: NEXT_PUBLIC_APP_URL
        value: https://datapilot.onrender.com # edit to your real service URL, then redeploy
      - key: NVIDIA_API_KEY
        sync: false # free NIM key from build.nvidia.com — preferred LLM for intent extraction
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-70b-instruct # override with any NIM chat model id
      - key: LLM_PROVIDER
        value: nvidia # priority order: nvidia, openrouter (both still fall back)
      - key: OPENROUTER_API_KEY
        sync: false # fallback OpenRouter key for real LLM intent extraction (free-tier model by default)
      - key: AI_MODEL
        value: x-ai/grok-4.1-fast:free # free; override with any OpenRouter model id
      - key: CRAWLER_SERVICE_URL
        value: https://datapilot-crawler.onrender.com # internal URL for crawler service

  - type: web
    name: datapilot-crawler
    env: python
    branch: main
    plan: free
    rootDir: crawler-service
    buildCommand: export CARGO_HOME="$HOME/.cargo" && export PATH="$CARGO_HOME/bin:/usr/local/cargo/bin:$PATH" && pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-db
          property: connectionString
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false # same free NIM key — used by utils/search_terms.py to expand search terms
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: datapilot-db
    plan: free
